# <!-- [SS-1]: Config Data ----->
[local]
bashFolder = "/data/data/com.termux/files/home/storage/shared/Termux/bash"
pyFolder = "/data/data/com.termux/files/home/storage/shared/Termux/py"

[autux]
LX = "/data/data/com.termux/files/home/.local/bin"
PX = "/data/data/com.termux/files/home/VenV/scripts"

[VenV]
path = "/data/data/com.termux/files/home/VenV"
py_depend = ["datetime"]
sh_depend = ["python", "android-tools", "ranger", "jq", "rclone", "bash-completion"]

[perms]
granted = ["SETTINGS", "STORAGE", "LOCATION", "READ_SMS", "SEND_SMS"]
failed = ["DEV_SETTINGS", "READ_PHONE_STATE", "READ_CONTACTS",]

# <!-- [SS-2]: DSL ----->
# /2.1/ Syncing Scripts
[task:sync_pyscripts]
type = sync
when = boot
source = $pyFolder
destination = $PX
extensions = [".py", ".pym", ".pyw", ".pyc", ".pyo"]
post = ["chmod +x", "log sync complete"]

[task:sync_bashscripts]
type = sync
when = boot
source = $bashFolder
destination = $LX
extensions = [".sh", ".bash", ".zsh"]
post = ["chmod +x", "log sync complete"]

# /2.2/ Dependencies
[task:install_deps]
type = install
when = boot
defaults = [{"py": ["datetime"]}, {"sh": ["python", "android-tools", "ranger", "jq", "rclone", "bash-completion"]}]

# /2.3/ Permissions
[task:request_permissions]
type = script
when = on_call
attempt = [
    "WRITE_SETTINGS"
    "READ_CONTACTS"
